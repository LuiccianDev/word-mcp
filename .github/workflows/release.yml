name: Release - Build & Publish Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to auto-detect from pyproject.toml, e.g. v2.0.0)'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Determine Release Tag and Version
        id: tag_info
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          TAG="${INPUT_TAG}"
          if [ -z "$TAG" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              TAG="$GITHUB_REF_NAME"
            else
              RAW_VER=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
              TAG="v$RAW_VER"
            fi
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$'; then
            echo "Error: Invalid semver tag '$TAG'." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo ">>> Resolved Release Tag: $TAG"
          echo ">>> Resolved Version: $VERSION"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Build Python Package (Wheel & Sdist)
        run: uv build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Extract Release Notes from CHANGELOG
        env:
          RELEASE_TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          python3 scripts/extract-release-notes.py --tag "$RELEASE_TAG" --output release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          body_path: release_body.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          make_latest: true
